# ============================================================
# Nginx production config — Boboloo Backend
# ============================================================
#
# SETUP (on EC2):
#   sudo cp nginx/boboloo.conf /etc/nginx/sites-available/boboloo
#   sudo ln -s /etc/nginx/sites-available/boboloo /etc/nginx/sites-enabled/boboloo
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL (Let's Encrypt):
#   sudo certbot --nginx -d api.yourdomain.com
#
# Replace YOURDOMAIN below with your actual domain before deploying.
# ============================================================

# ── Redirect HTTP → HTTPS ───────────────────────────────────
server {
    listen 80;
    server_name YOURDOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS server ────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name YOURDOMAIN;

    # ── SSL (filled in by certbot) ──────────────────────────
    ssl_certificate     /etc/letsencrypt/live/YOURDOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOURDOMAIN/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Upload size ─────────────────────────────────────────
    # Must exceed BOBOTV_MAX_UPLOAD_SIZE_MB (500 MB) by a safe margin.
    client_max_body_size 520M;

    # ── Timeouts for large video uploads ───────────────────
    # A 500 MB upload on a 10 Mbps connection takes ~400 s.
    # All three must be > that value.
    proxy_connect_timeout 300s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    # ── Do not buffer request body in Nginx ────────────────
    # Without this, Nginx holds the entire upload in memory/disk before
    # forwarding to FastAPI — defeating the streaming upload design.
    proxy_request_buffering off;

    # ── Do not buffer response ─────────────────────────────
    proxy_buffering off;

    # ── Proxy to FastAPI (Gunicorn/Uvicorn) ────────────────
    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Keep-alive to upstream
        proxy_set_header   Connection        "";
    }

    # ── Health check — no logging noise ────────────────────
    location = /health {
        proxy_pass http://127.0.0.1:8080/health;
        access_log off;
    }
}
