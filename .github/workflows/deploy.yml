name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd /home/ubuntu/boboloo-backend-interaction

          git pull origin main

          sudo docker stop boboloo-backend || true
          sudo docker rm boboloo-backend || true

          sudo docker build -t boboloo-backend .

          sudo docker run -d -p 8000:8080 \
            --env-file .env \
            --name boboloo-backend \
            --restart always \
            boboloo-backend