<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BoboTV Demo Player</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0f0f0f; color: #f0f0f0; padding: 24px; }
    h1 { color: #f59e0b; margin-bottom: 4px; }
    p.sub { color: #9ca3af; font-size: 0.875rem; margin-bottom: 24px; }

    .config { background: #1c1c1c; border: 1px solid #333; border-radius: 8px; padding: 16px; margin-bottom: 24px; }
    .config label { display: block; font-size: 0.8rem; color: #9ca3af; margin-bottom: 4px; margin-top: 12px; }
    .config input { width: 100%; padding: 8px 10px; background: #111; border: 1px solid #444; border-radius: 6px; color: #f0f0f0; font-size: 0.875rem; }
    .config input:focus { outline: none; border-color: #f59e0b; }

    button { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.875rem; font-weight: 600; transition: background 0.15s; }
    .btn-primary { background: #f59e0b; color: #0f0f0f; }
    .btn-primary:hover { background: #d97706; }
    .btn-danger { background: #ef4444; color: #fff; }
    .btn-danger:hover { background: #dc2626; }
    .btn-sm { padding: 6px 14px; font-size: 0.8rem; }

    .section { background: #1c1c1c; border: 1px solid #333; border-radius: 8px; padding: 16px; margin-bottom: 20px; }
    .section h2 { font-size: 1rem; color: #f59e0b; margin-bottom: 12px; }

    #video-list { list-style: none; }
    #video-list li { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #2a2a2a; gap: 12px; }
    #video-list li:last-child { border-bottom: none; }
    .vid-info { flex: 1; }
    .vid-title { font-weight: 600; }
    .vid-meta { font-size: 0.75rem; color: #9ca3af; margin-top: 2px; }
    .vid-actions { display: flex; gap: 8px; }

    #player-section { display: none; }
    video { width: 100%; border-radius: 6px; background: #000; }

    .upload-form { display: flex; flex-direction: column; gap: 10px; }
    .upload-form input[type="file"] { color: #f0f0f0; }
    #status { margin-top: 10px; font-size: 0.85rem; min-height: 20px; color: #34d399; }
    #status.error { color: #ef4444; }

    .pagination { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
  </style>
</head>
<body>

<h1>📺 BoboTV Demo</h1>
<p class="sub">Front-end integration reference — connects to the real BoboTV API.</p>

<!-- ── CONFIG ── -->
<div class="config">
  <label>API Base URL</label>
  <input id="cfg-base" value="http://localhost:8080" placeholder="https://api.yourdomain.com" />
  <label>Firebase ID Token (Bearer)</label>
  <input id="cfg-token" type="password" placeholder="Paste your Firebase ID token here" />
</div>

<!-- ── VIDEO LIST ── -->
<div class="section">
  <h2>🎬 Available Videos</h2>
  <ul id="video-list"><li style="color:#9ca3af">Press "Load" to fetch videos.</li></ul>
  <div class="pagination">
    <button class="btn-primary btn-sm" onclick="loadVideos()">Load / Refresh</button>
    <button class="btn-sm" id="btn-prev" onclick="changePage(-1)" disabled>← Prev</button>
    <span id="page-label" style="font-size:0.8rem;color:#9ca3af"></span>
    <button class="btn-sm" id="btn-next" onclick="changePage(1)" disabled>Next →</button>
  </div>
</div>

<!-- ── PLAYER ── -->
<div class="section" id="player-section">
  <h2>▶️ Now Playing: <span id="now-playing-title"></span></h2>
  <video id="video-player" controls preload="metadata"></video>
  <p style="font-size:0.75rem;color:#9ca3af;margin-top:6px">
    Streaming via a short-lived presigned S3 URL. Seeking is fully supported.
  </p>
</div>

<!-- ── ADMIN UPLOAD ── -->
<div class="section">
  <h2>⬆️ Admin Upload (requires admin Firebase token)</h2>
  <div class="upload-form">
    <input id="up-title" placeholder="Video title *" maxlength="256" />
    <input id="up-desc" placeholder="Description (optional)" maxlength="2048" />
    <input type="file" id="up-file" accept="video/mp4,video/quicktime" />
    <button class="btn-primary" onclick="uploadVideo()">Upload Video</button>
  </div>
  <div id="status"></div>
</div>


<script>
/* ── helpers ── */
function base() { return document.getElementById('cfg-base').value.replace(/\/$/, ''); }
function token() { return document.getElementById('cfg-token').value.trim(); }
function headers(extra = {}) {
  return { Authorization: `Bearer ${token()}`, ...extra };
}
function setStatus(msg, isError = false) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = isError ? 'error' : '';
}
function fmtSize(bytes) {
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

/* ── pagination state ── */
let _page = 1;
let _totalPages = 1;

async function loadVideos(page = _page) {
  _page = page;
  try {
    const r = await fetch(`${base()}/api/v1/bobotv/videos?page=${page}&page_size=10`, {
      headers: headers(),
    });
    if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
    const data = await r.json();
    _totalPages = data.total_pages;
    renderList(data.items, data);
  } catch (e) {
    document.getElementById('video-list').innerHTML =
      `<li style="color:#ef4444">Error: ${e.message}</li>`;
  }
}

function renderList(videos, meta) {
  const ul = document.getElementById('video-list');
  if (!videos.length) {
    ul.innerHTML = '<li style="color:#9ca3af">No videos uploaded yet.</li>';
  } else {
    ul.innerHTML = videos.map(v => `
      <li>
        <div class="vid-info">
          <div class="vid-title">${escHtml(v.title)}</div>
          <div class="vid-meta">${fmtSize(v.file_size)} · ${v.mime_type} · ${new Date(v.created_at).toLocaleDateString()}</div>
          ${v.description ? `<div class="vid-meta">${escHtml(v.description)}</div>` : ''}
        </div>
        <div class="vid-actions">
          <button class="btn-primary btn-sm" onclick="playVideo('${v.id}', '${escHtml(v.title)}')">▶ Play</button>
        </div>
      </li>
    `).join('');
  }

  document.getElementById('page-label').textContent = `Page ${meta.page} / ${meta.total_pages} (${meta.total} total)`;
  document.getElementById('btn-prev').disabled = meta.page <= 1;
  document.getElementById('btn-next').disabled = meta.page >= meta.total_pages;
}

function changePage(delta) { loadVideos(_page + delta); }

async function playVideo(videoId, title) {
  try {
    const r = await fetch(`${base()}/api/v1/bobotv/videos/${videoId}/stream`, {
      headers: headers(),
    });
    if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
    const data = await r.json();

    document.getElementById('player-section').style.display = 'block';
    document.getElementById('now-playing-title').textContent = title;
    const vid = document.getElementById('video-player');
    vid.src = data.stream_url;
    vid.play();
    vid.scrollIntoView({ behavior: 'smooth' });
  } catch (e) {
    alert('Could not load video: ' + e.message);
  }
}

async function uploadVideo() {
  const title = document.getElementById('up-title').value.trim();
  const desc = document.getElementById('up-desc').value.trim();
  const fileInput = document.getElementById('up-file');
  const file = fileInput.files[0];

  if (!title) { setStatus('Title is required.', true); return; }
  if (!file) { setStatus('Please select a video file.', true); return; }

  const formData = new FormData();
  formData.append('title', title);
  if (desc) formData.append('description', desc);
  formData.append('file', file);

  setStatus('Uploading… (this may take a moment for large files)');
  try {
    const r = await fetch(`${base()}/api/v1/bobotv/videos`, {
      method: 'POST',
      headers: headers(),   // no Content-Type — browser sets multipart boundary
      body: formData,
    });
    if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
    const data = await r.json();
    setStatus(`✓ Uploaded "${data.title}" (${fmtSize(data.file_size)})`);
    fileInput.value = '';
    document.getElementById('up-title').value = '';
    document.getElementById('up-desc').value = '';
    loadVideos(1);
  } catch (e) {
    setStatus('Upload failed: ' + e.message, true);
  }
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
